# Render Infrastructure as Code Blueprint for Bumblebee Platform

services:
  # 1. Next.js Frontend Web Service
  - type: web
    name: bumblebee-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bumblebee-postgres
          property: connectionString

  # 2. Python Continuous Watchdog Background Worker
  - type: worker
    name: bumblebee-python-worker
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scheduler.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: bumblebee-postgres
          property: connectionString

databases:
  # 3. PostgreSQL Database
  - name: bumblebee-postgres
    plan: free
    databaseName: bumblebee_db
    user: bumblebee
